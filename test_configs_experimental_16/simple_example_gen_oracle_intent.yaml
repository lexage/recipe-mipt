type: SIMPLE

# === ЭКСПЕРИМЕНТ 16: oracle-генерация ===
# OracleIntentGenerator: intents добываются LLM'ом ИЗ ЭТАЛОННЫХ ОТВЕТОВ DS1000
# (stage 1, ~1000 LLM-вызовов, кэшируется в data/oracle_intents.jsonl), затем
# KNN-классификатор на эмбеддингах (stage 2, без LLM) впечатывает k ближайших
# intent'ов в КАЖДЫЙ документ и КАЖДЫЙ example всей базы. Oracle-пара к
# INTENT_BASED_GENERATOR (exp15/16, deployable — тот же формат префикса, но
# intents придумываются из документации, не из тестовых ответов).
# index_sources: ["documents", "examples"] — иначе examples не попадут на вход
# generate() и не получат intents.
# БД: data/docs_database_examples.db

params:
  top_k: 5
  keep_source_docs: False

components:

  embedder:
    type: EMBEDDING_AGENT
    params:
      name: embedder
      url: "http://0.0.0.0:7216/v1"
      model_name: "Qwen/Qwen3-Embedding-4B"

  data_base:
    type: LOCAL_DB
    params:
      path_to_db: "data/docs_database_examples.db"
      path_to_vector_db: "data/vdb_exp16/simple_example_gen_oracle_intent"
      collection_name: "docs"
      index_sources: ["documents", "examples"]
      return_full_docs: False
      return_examples: False
      merge_examples: False

  chunker:
    type: RECURSIVE_CHUNKER
    params:
      name: chunker
      max_chunk_size: 1000

  generator:
    type: ORACLE_INTENT_GENERATOR
    params:
      name: oracle_intent_gen
      url: "http://0.0.0.0:7213/v1"
      model_name: "Qwen/Qwen2.5-7B-Instruct"
      dataset_path: "data/ds1000/ds1000.jsonl.gz"
      intents_cache_path: "data/oracle_intents.jsonl"
      n_intents: 5
      k: 3
      num_workers: 8

  context_assembler:
    type: CORAG_CONTEXT_ASSEMBLER
    params:
      name: corag_assembler

  retriever:
    type: SIMPLE_RETRIEVER
    params:
      name: simple_retriever

  agent:
    type: DS1000_SOLVER_AGENT
    params:
      name: ds1000_solver
      url: "http://0.0.0.0:7114/v1"
      model_name: "Qwen/Qwen2.5-32B-Instruct"
      api: chat
      context_after_task: False
      temperature: 0.2
      top_p: 0.95
      max_tokens: 1024
      stop_tokens: ["</code>", "# SOLUTION END"]
