type: SIMPLE

# === ЭКСПЕРИМЕНТ 16: E6, исходный корпус с примерами внутри content ===
# Без всякой аугментации. Плейсхолдеры <example_N> заменены на код примеров
#   ДО чанкинга и эмбеддинга (merge_examples делает это только на этапе
#   выдачи, когда чанк уже выбран). Изолирует структурный эффект: ручные
#   документы несут код инлайн, исходные — нет.
#   Сравнивать с e0_baseline.
# ЗАПУСКАТЬ С --log-chunks (нужен для анализа E7).
# БД: data/exp16/docs_base_inlined.db

params:
  top_k: 5

components:

  embedder:
    type: EMBEDDING_AGENT
    params:
      name: embedder
      url: "http://0.0.0.0:7216/v1"
      model_name: "Qwen/Qwen3-Embedding-4B"

  data_base:
    type: LOCAL_DB
    params:
      path_to_db: "data/exp16/docs_base_inlined.db"
      path_to_vector_db: "data/vdb_exp16_base_inlined_rc_1000"
      collection_name: "docs"

      return_examples: True
      return_full_docs: False
      merge_examples: True

      hnsw_space: "cosine"
      hnsw_m: 16
      hnsw_construction_ef: 400
      hnsw_search_ef: 200
      batch_size: 16

      search_filter:
        source: "documents"

  chunker:
    type: RECURSIVE_CHUNKER
    params:
      name: chunker
      max_chunk_size: 1000

  context_assembler:
    type: CORAG_CONTEXT_ASSEMBLER
    params:
      name: simple_assembler

  retriever:
    type: SIMPLE_RETRIEVER
    params:
      name: simple_retriever

  enchancer:
    type: QUERY_GENERATOR
    params:
      name: query_gen
      url: "http://0.0.0.0:7114/v1"
      model_name: "Qwen/Qwen2.5-32B-Instruct"
      options: 1

  agent:
    type: DS1000_SOLVER_AGENT
    params:
      name: ds1000_solver

      url: "http://0.0.0.0:7114/v1"
      model_name: "Qwen/Qwen2.5-32B-Instruct"

      api: chat
      context_after_task: False

      temperature: 0.2
      top_p: 0.95
      max_tokens: 1024
      stop_tokens: ["</code>", "# SOLUTION END"]
