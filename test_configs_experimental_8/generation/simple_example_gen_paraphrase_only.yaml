type: SIMPLE

# === ЭКСПЕРИМЕНТ 8: генерация (оракул), всё в examples ===
# Конфиг: simple_example_gen_paraphrase_only
#   Оракул: перефраз reference_code ds1000 -> examples.
#   Индекс = ТОЛЬКО парафразы (keep_source_docs: False, база выкинута). vs pure_examples.
# БД: data/docs_database_examples.db

params:
  top_k: 5
  keep_source_docs: False

components:

  embedder:
    type: EMBEDDING_AGENT
    params:
      name: embedder
      url: "http://0.0.0.0:7216/v1"
      model_name: "Qwen/Qwen3-Embedding-4B"

  data_base:
    type: LOCAL_DB
    params:
      path_to_db: "data/docs_database_examples.db"
      path_to_vector_db: "data/vdb_exp8/simple_example_gen_paraphrase_only"
      collection_name: "docs"
      index_sources: ["examples"]
      return_full_docs: False
      return_examples: False
      merge_examples: False

  chunker:
    type: RECURSIVE_CHUNKER
    params:
      name: chunker
      max_chunk_size: 1000

  generator:
    type: PARAPHRASE_GENERATOR
    params:
      name: paraphrase_generator
      url: "http://0.0.0.0:7215/v1"
      model_name: "Qwen/Qwen2.5-32B-Instruct"
      dataset_path: "data/ds1000/ds1000.jsonl.gz"
      n_paraphrases: 3
      num_workers: 4
      temperature: 0.6

  context_assembler:
    type: CORAG_CONTEXT_ASSEMBLER
    params:
      name: corag_assembler

  retriever:
    type: SIMPLE_RETRIEVER
    params:
      name: simple_retriever

  agent:
    type: DS1000_SOLVER_AGENT
    params:
      name: ds1000_solver
      url: "http://0.0.0.0:7215/v1"
      model_name: "Qwen/Qwen2.5-32B-Instruct"
      api: chat
      context_after_task: False
      temperature: 0.2
      top_p: 0.95
      max_tokens: 1024
      stop_tokens: ["</code>", "# SOLUTION END"]
