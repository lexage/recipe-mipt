type: SIMPLE

# === ЭКСПЕРИМЕНТ 15: диагностика ретрива (запускать с --log-chunks!) ===
# Конфиг: simple_example_pure_aug_chunks — ручная БД v1 (как exp12), чтобы
#   увидеть, какие из 197 ручных доков реально попадают в top-5 контекста.
# ВНИМАНИЕ: солвер на 7114 (AWQ) — прямое сравнение PASS@1 с exp12 (полная 32B)
#   имеет конфаунд модели; целевой выход прогона — retrieved_chunks.jsonl.
# БД: data/docs_database_examples_aug.db (оригинал + 197 ручных доков)

params:
  top_k: 5

components:

  embedder:
    type: EMBEDDING_AGENT
    params:
      name: embedder
      url: "http://0.0.0.0:7216/v1"
      model_name: "Qwen/Qwen3-Embedding-4B"

  data_base:
    type: LOCAL_DB
    params:
      path_to_db: "data/docs_database_examples_aug.db"
      path_to_vector_db: "data/vdb_exp15_aug_rc_1000"
      collection_name: "docs"

      return_examples: True
      return_full_docs: False
      merge_examples: True

      hnsw_space: "cosine"
      hnsw_m: 16
      hnsw_construction_ef: 400
      hnsw_search_ef: 200
      batch_size: 16

      search_filter:
        source: "documents"

  chunker:
    type: RECURSIVE_CHUNKER
    params:
      name: chunker
      max_chunk_size: 1000

  context_assembler:
    type: CORAG_CONTEXT_ASSEMBLER
    params:
      name: simple_assembler

  retriever:
    type: SIMPLE_RETRIEVER
    params:
      name: simple_retriever

  enchancer:
    type: QUERY_GENERATOR
    params:
      name: query_gen
      url: "http://0.0.0.0:7114/v1"
      model_name: "Qwen/Qwen2.5-32B-Instruct-AWQ"
      options: 1

  agent:
    type: DS1000_SOLVER_AGENT
    params:
      name: ds1000_solver

      url: "http://0.0.0.0:7114/v1"
      model_name: "Qwen/Qwen2.5-32B-Instruct-AWQ"

      api: chat
      context_after_task: False

      temperature: 0.2
      top_p: 0.95
      max_tokens: 1024
      stop_tokens: ["</code>", "# SOLUTION END"]
