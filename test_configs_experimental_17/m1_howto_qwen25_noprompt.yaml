type: SIMPLE

# === ЭКСПЕРИМЕНТ 17: метод 1 без правил в промпте солвера (контроль) ===
# Тот же генератор, но солвер с дефолтным промптом. Проверяет, складываются
#   ли эффекты промпта и синтетики или перекрываются.
#   Сравнивать с baseline 44.10.
#
# ПОРТЫ НЕ ЗАФИКСИРОВАНЫ. Перед запуском:
#   python db_scripts/set_exp17_ports.py --gen PORT --solver PORT --embed PORT
# ЗАПУСКАТЬ С --log-chunks.

params:
  top_k: 5
  keep_source_docs: True

components:

  embedder:
    type: EMBEDDING_AGENT
    params:
      name: embedder
      url: "http://0.0.0.0:7216/v1"
      model_name: "Qwen/Qwen3-Embedding-4B"

  data_base:
    type: LOCAL_DB
    params:
      path_to_db: "data/docs_database_examples.db"
      path_to_vector_db: "data/vdb_exp17_m1_q25_np_rc_1000"
      collection_name: "docs"

      return_examples: True
      return_full_docs: False
      merge_examples: True

      hnsw_space: "cosine"
      hnsw_m: 16
      hnsw_construction_ef: 400
      hnsw_search_ef: 200
      batch_size: 16

      search_filter:
        source: "documents"

  chunker:
    type: RECURSIVE_CHUNKER
    params:
      name: chunker
      max_chunk_size: 1000

  generator:
    type: HOWTO_GUIDE_GENERATOR
    params:
      name: howto_guide_generator
      url: "http://0.0.0.0:7114/v1"          # GEN_URL
      model_name: "Qwen/Qwen2.5-32B-Instruct"                  # GEN_MODEL
      path_to_db: "data/docs_database_examples.db"
      n_docs: 200
      min_count: 5
      context_docs: 0
      context_chars: 700
      num_workers: 8
      temperature: 0.7
      dump_path: "results/gen_dumps/m1_howto_qwen25_noprompt.jsonl"

  context_assembler:
    type: CORAG_CONTEXT_ASSEMBLER
    params:
      name: simple_assembler

  retriever:
    type: SIMPLE_RETRIEVER
    params:
      name: simple_retriever

  enchancer:
    type: QUERY_GENERATOR
    params:
      name: query_gen
      url: "http://0.0.0.0:7114/v1"
      model_name: "Qwen/Qwen2.5-32B-Instruct"
      options: 1

  agent:
    type: DS1000_SOLVER_AGENT
    params:
      name: ds1000_solver

      url: "http://0.0.0.0:7114/v1"
      model_name: "Qwen/Qwen2.5-32B-Instruct"

      api: chat
      context_after_task: False

      temperature: 0.2
      top_p: 0.95
      max_tokens: 1024
      stop_tokens: ["</code>", "# SOLUTION END"]
