type: SIMPLE

# === ЭКСПЕРИМЕНТ 17, конфиг 4/4: починенный API-якорный генератор ===
# Тот же контракт документа и тот же протокольный пакет, что у конфига 2/4, но
# темы выбираются плоско: один документ на API из переписи корпуса, без плана.
# Перепись починена (exp15: 47% совпадений голых методов были хвостами
# квалифицированных вызовов, 39 из 149 API попали к чужой библиотеке), отбор
# идёт по полосе редкости 5..100 и по спутываемости, а не по топ-частоте.
# Сравнение с конфигом 2/4 изолирует ровно отбор тем.
#
# Энхансер не объявляется — см. комментарий в simple_example_pure_e17.yaml.

params:
  top_k: 5
  keep_source_docs: True
  generation_seed: 20260824
  materialize_db_path: "data/generated/e17_gen_api__examples__seed20260824.db"
  on_exists: "rebuild"

components:

  embedder:
    type: EMBEDDING_AGENT
    params:
      name: embedder
      url: "http://0.0.0.0:7216/v1"
      model_name: "Qwen/Qwen3-Embedding-4B"

  data_base:
    type: LOCAL_DB
    params:
      path_to_db: "data/docs_database_examples.db"
      path_to_vector_db: "data/vdb_exp17_gen_api_rc1000"
      collection_name: "docs"

      return_examples: True
      return_full_docs: False
      merge_examples: True

      hnsw_space: "cosine"
      hnsw_m: 16
      hnsw_construction_ef: 400
      hnsw_search_ef: 200
      batch_size: 16

      search_filter:
        source: "documents"

  chunker:
    type: RECURSIVE_CHUNKER
    params:
      name: chunker
      max_chunk_size: 1000

  generator:
    type: API_GUIDE_GENERATOR
    params:
      name: api_guide_generator
      # model_name не задаётся — резолвится с эндпоинта (см. комментарий у agent).
      url: "http://0.0.0.0:7114/v1"
      path_to_db: "data/docs_database_examples.db"

      n_api_docs: 150
      n_protocol_docs: 24

      min_count: 5
      max_count: 100

      num_workers: 8
      temperature: 0.2
      max_retries: 2

      dump_path: "results/gen_dumps/e17_gen_api.jsonl"

  context_assembler:
    type: CORAG_CONTEXT_ASSEMBLER
    params:
      name: simple_assembler

  retriever:
    type: SIMPLE_RETRIEVER
    params:
      name: simple_retriever

  agent:
    type: DS1000_SOLVER_AGENT
    params:
      name: ds1000_solver

      # Модель НЕ задаётся: DS1000Solver берёт её с эндпоинта
      # (client.models.list()), поэтому решает то, что реально поднято на 7114.
      # На 24.08.2026 это Qwen/Qwen2.5-32B-Instruct (полная, не AWQ).
      url: "http://0.0.0.0:7114/v1"

      api: chat

      temperature: 0.2
      top_p: 0.95
      max_tokens: 1024
      stop_tokens: ["</code>", "# SOLUTION END"]
