type: SIMPLE

# Сравнение с pure_no_rag: добавлен минимальный retrieval-блок,
# чтобы фильтр SimpleLexicalFiltrator мог быть задействован.
# БЕЗ enhancer (QueryGenerator) и БЕЗ CoRAGContextAssembler — упрощённый стек.

params:
  top_k: 5

components:

  embedder:
    type: EMBEDDING_AGENT
    params:
      name: embedder
      url: "http://0.0.0.0:7216/v1"
      model_name: "Qwen/Qwen3-Embedding-4B"

  data_base:
    type: LOCAL_DB
    params:
      path_to_db: "data/docs_database_examples_apis.db"
      path_to_vector_db: "data/docs_vdb_rc_1000_meta_ml20"
      collection_name: "docs"

      return_examples: True
      return_full_docs: False
      merge_examples: False

      hnsw_space: "cosine"
      hnsw_m: 16
      hnsw_construction_ef: 400
      hnsw_search_ef: 200
      batch_size: 16

      search_filter:
        source: "documents"

  chunker:
    type: RECURSIVE_CHUNKER
    params:
      name: chunker
      max_chunk_size: 1000

  filter:
    type: SIMPLE_LEXICAL_FILTER
    params:
      config:
        remove_junk_blocks: true          # удалять даты, DOI, ISBN, email...
        remove_navigation_lines: true     # "see also", "View on GitHub" и т.п.
        remove_terminal_sections: true    # отрезать всё после "References#"
        normalize_empty_lines: true       # схлопывать множественные \n
        min_len_for_dedup: 5
        sliding_window_max_length: 50

  retriever:
    type: SIMPLE_RETRIEVER
    params:
      name: simple_retriever

  context_assembler:
    type: SIMPLE_CONTEXT_ASSEMBLER
    params:
      name: simple_assembler

  agent:
    type: DS1000_SOLVER_AGENT
    params:
      name: ds1000_solver

      url: "http://0.0.0.0:7215/v1"
      model_name: "Qwen/Qwen2.5-32B-Instruct"

      api: chat
      context_after_task: False

      temperature: 0.2
      top_p: 0.95
      max_tokens: 1024
      stop_tokens: ["</code>", "# SOLUTION END"]
