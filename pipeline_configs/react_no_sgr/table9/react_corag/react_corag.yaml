# Source: таблица 9/react_exp_temp_0.7_19_fix_db_search_qwen2_5_corag/react_exp_temp_0.7_19_fix_db_search_qwen2_5_corag.yaml
# Historical archive used DeepSeek, but this runnable Alibaba config is normalized to Qwen2.5.
type: REACT
components:
  embedder:
    type: EMBEDDING_AGENT
    params:
      name: embedder
      url: http://127.0.0.1:11459/v1
      model_name: Qwen/Qwen3-Embedding-4B
  data_base:
    type: LOCAL_DB
    params:
      path_to_db: /home/shtraukh/work/recipe-mipt/data/docs_database_examples.db
      path_to_vector_db: /home/shtraukh/work/recipe-mipt/data/docs_vector_database_qwen_4b
      collection_name: docs
  context_assembler:
    type: CORAG_CONTEXT_ASSEMBLER
    params:
      name: simple_assembler
  retriever:
    type: CORAG_RETRIEVER
    params:
      name: corag_retriever
      url: http://127.0.0.1:11458/v1
      search_type: sample
      return_docs_as_chunks: false
      max_path_length: 3
      max_message_length: 4096
      temperature: 0.7
      task_description: answer multihop question
      return_only_path: true
      expand_size: 4
      num_rollouts: 2
      beam_size: 1
      n: 2
  tools:
  - type: DB_SEARCH_TOOL
    params:
      top_k: 5
  agent:
    type: REACT_AGENT_NO_SGR
    params:
      name: ReActAgentNoSGR
      url: http://127.0.0.1:11458/v1
      model_name: Qwen/Qwen2.5-32B-Instruct
      temperature: 0.7
      max_iterations: 10
      history_context: 5
      few_shot_type: zero_shot
logs_path: pipeline_configs/react_no_sgr/table9/react_corag/logs
