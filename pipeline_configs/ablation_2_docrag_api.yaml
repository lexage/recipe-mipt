# Ablation 2 — Doc-RAG (APIRetriever, basic)
# Vanilla document RAG: APIRetriever picks relevant library APIs (via api_selector)
# and pulls the matching doc chunks. No rationales, no examples, no full docs.
type: SIMPLE

params:
  top_k: 5

components:

  embedder:
    type: EMBEDDING_AGENT
    params:
      name: embedder
      url: "http://localhost:7216/v1"
      model_name: "Qwen/Qwen3-Embedding-4B"

  data_base:
    type: LOCAL_DB
    params:
      path_to_db: "C:/Projects/docs_database_examples.db"
      path_to_vector_db: "data/vdb_ablation_2_docrag"
      collection_name: "docs"
      return_full_docs: False
      return_examples: False
      merge_examples: False
      hnsw_space: "cosine"
      hnsw_m: 16
      hnsw_construction_ef: 400
      hnsw_search_ef: 200
      batch_size: 16
      similarity_threshold: 0.1
      search_filter:
        source: "documents"

  chunker:
    type: RECURSIVE_CHUNKER
    params:
      name: chunker
      max_chunk_size: 1000

  filter:
    type: LENGTH_FILTER
    params:
      name: filter
      min_len: 20

  context_assembler:
    type: CORAG_CONTEXT_ASSEMBLER
    params:
      name: corag_assembler

  # dependency of the APIRetriever (selects which library APIs are relevant)
  api_selector:
    type: API_SELECTOR
    params:
      url: "http://localhost:7215/v1"

  retriever:
    type: API_RETRIEVER
    params:
      name: api_retriever
      max_apis: 6
      api_top_k: 1
      chunks_per_api: 1
      ignore_libs: []

  agent:
    type: CODEMMLU_SOLVER_AGENT
    params:
      name: codemmlu_solver
      url: "http://localhost:7215/v1"
      model_name: "Qwen/Qwen2.5-32B-Instruct"
      api: completions
      context_after_task: False
      temperature: 0.2
      top_p: 0.95
      max_tokens: 1024
      stop_tokens: []
