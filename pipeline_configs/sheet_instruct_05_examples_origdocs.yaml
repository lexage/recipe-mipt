# sheet: API_INSTRUCT_RETRIEVER + INSTRUCT_CONTEXT_ASSEMBLER  (DS1000 PASS@1 56.2)
# max_apis=6, api_top_k=1, chunks_per_api=1, include_original_docs=TRUE,
# return_examples=TRUE, merge_examples=TRUE. CodeMMLU solver.
type: SIMPLE

params:
  top_k: 6

components:

  embedder:
    type: EMBEDDING_AGENT
    params:
      name: embedder
      url: "http://localhost:7216/v1"
      model_name: "Qwen/Qwen3-Embedding-4B"

  data_base:
    type: LOCAL_DB
    params:
      path_to_db: "C:/Projects/docs_database_examples.db"
      path_to_vector_db: "data/vdb_sheet_instruct_05_examples_origdocs"
      collection_name: "docs"
      return_full_docs: False
      return_examples: True
      merge_examples: True
      hnsw_space: "cosine"
      hnsw_m: 16
      hnsw_construction_ef: 400
      hnsw_search_ef: 200
      batch_size: 16
      similarity_threshold: 0.1
      search_filter:
        source: "documents"

  chunker:
    type: RECURSIVE_CHUNKER
    params:
      name: chunker
      max_chunk_size: 1000

  filter:
    type: LENGTH_FILTER
    params:
      name: filter
      min_len: 20

  context_assembler:
    type: INSTRUCT_CONTEXT_ASSEMBLER
    params:
      name: instruct_assembler

  api_selector:
    type: API_SELECTOR
    params:
      url: "http://localhost:7215/v1"
      temperature: 0.1
      max_tokens: 256

  rationality_agent:
    type: API_INSTRUCT_RATIONALITY_AGENT
    params:
      url: "http://localhost:7215/v1"
      model_name: "Qwen/Qwen2.5-32B-Instruct"
      temperature: 0.2
      top_p: 0.95
      max_tokens: 384

  retriever:
    type: API_INSTRUCT_RETRIEVER
    params:
      name: api_instruct_retriever
      max_apis: 6
      api_top_k: 1
      chunks_per_api: 1
      include_original_docs: True

  agent:
    type: CODEMMLU_SOLVER_AGENT
    params:
      name: codemmlu_solver
      url: "http://localhost:7215/v1"
      model_name: "Qwen/Qwen2.5-32B-Instruct"
      api: completions
      context_after_task: False
      temperature: 0.2
      top_p: 0.95
      max_tokens: 1024
      stop_tokens: []
