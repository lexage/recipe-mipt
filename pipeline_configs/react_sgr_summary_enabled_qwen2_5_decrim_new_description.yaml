type: REACT
components:
  tools:
    - type: LIST_FILES_TOOL
    - type: READ_FILE_TOOL
    - type: SEARCH_CODE_TOOL
    - type: APPLY_PATCH_TOOL
    - type: RUN_COMMAND_TOOL
      params:
        default_timeout: 120
        max_timeout: 600
        # Ready SWE-rebench images already contain the task environment.
        # Network installation wastes iterations and is unavailable in offline runs.
        allow_package_install: false
    - type: GIT_DIFF_TOOL
    - type: CRITIC_TOOL
      params:
        name: decrim
        description: >
          Review the current candidate repository patch for a SWE-rebench task.
          You MUST invoke this tool after applying code changes, obtaining the complete
          current git diff, and running or attempting to run relevant tests, and before
          finishing the task. Pass the original issue in task. In answer, include the
          complete current git diff, relevant test commands and results, and a concise
          explanation of how the patch addresses the issue. Use the feedback to revise
          and revalidate the patch when unmet requirements or unsupported assumptions
          are identified. If the patch is materially changed after the review, invoke
          this tool again before finishing.
        url: http://localhost:11456/v1
        model_name: Qwen/Qwen2.5-32B-Instruct


  agent:
    type: REACT_AGENT_SGR
    params:
      name: react-sgr-swe-rebench
      url: http://localhost:11456/v1
      model_name: Qwen/Qwen2.5-32B-Instruct
      temperature: 0.7
      max_iterations: 60
      history_context: 5
      # max_tokens: None
      few_shot_type: zero_shot
      # The evaluator consumes the repository diff; avoid an extra LLM request
      # after the structured finish step.
      synthesize_final_answer: false
      # Recursively compress every completed action/observation step.
      # The token limit bounds the summary response.
      trajectory_summary_enabled: true
      trajectory_summary_max_tokens: 2048
      trajectory_summary_temperature: 0.0

logs_path: /workspace/proj/grant_swe_rebench/recipe-mipt/logs
