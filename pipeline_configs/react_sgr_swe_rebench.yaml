type: REACT
components:
  tools:
    - type: LIST_FILES_TOOL
    - type: READ_FILE_TOOL
    - type: SEARCH_CODE_TOOL
    - type: REPLACE_TEXT_TOOL
    - type: APPLY_PATCH_TOOL
    - type: RUN_COMMAND_TOOL
      params:
        default_timeout: 120
        max_timeout: 600
        # Ready SWE-rebench images already contain the task environment.
        # Network installation wastes iterations and is unavailable in offline runs.
        allow_package_install: false
    - type: GIT_DIFF_TOOL

  agent:
    type: REACT_AGENT_SGR
    params:
      name: react-sgr-swe-rebench
      url: http://localhost:11455/v1
      model_name: Qwen/Qwen2.5-32B-Instruct
      temperature: 0.7
      max_iterations: 60
      history_context: 10
      max_tokens: 1024
      few_shot_type: zero_shot
      # The evaluator consumes the repository diff; avoid an extra LLM request
      # after the structured finish step.
      synthesize_final_answer: false
      # Require a repository change and current diff review before accepting
      # finish. Validation remains advisory because benchmark test patches may
      # intentionally change expectations that are unavailable during inference.
      require_repository_change_before_finish: true
      require_diff_before_finish: true
      require_validation_before_finish: false
      # Force one fresh adversarial review of every edited revision before finish.
      require_patch_review_before_finish: true

logs_path: /workspace/proj/grant_swe_rebench/recipe-mipt/logs
