type: REACT
components:
  tools:
    - type: LIST_FILES_TOOL
    - type: READ_FILE_TOOL
    - type: SEARCH_CODE_TOOL
    - type: APPLY_PATCH_TOOL
    - type: RUN_COMMAND_TOOL
      params:
        default_timeout: 120
        max_timeout: 600
    - type: GIT_DIFF_TOOL

  agent:
    type: REACT_AGENT_SGR
    params:
      name: react-sgr-swe-rebench
      url: http://localhost:11455/v1
      model_name: Qwen/Qwen2.5-32B-Instruct
      temperature: 0.0
      max_iterations: 30

logs_path: /workspace/proj/grant_swe_rebench/recipe-mipt/logs
