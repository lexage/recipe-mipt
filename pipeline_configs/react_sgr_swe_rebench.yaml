type: REACT
components:
  tools:
    - type: LIST_FILES_TOOL
    - type: READ_FILE_TOOL
    - type: SEARCH_CODE_TOOL
    - type: APPLY_PATCH_TOOL
    - type: RUN_COMMAND_TOOL
      params:
        default_timeout: 120
        max_timeout: 600
    - type: GIT_DIFF_TOOL

  agent:
    type: REACT_AGENT_SGR
    params:
      name: react-sgr-swe-rebench
      url: http://host.docker.internal:11469/v1
      model_name: ebircak/gemma-4-31B-it-4bit-W4A16-GPTQ
      temperature: 0.0
      max_iterations: 30

logs_path: /workspace/swe-rebench-recipe/logs
