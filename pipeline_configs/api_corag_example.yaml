type: SIMPLE

params:
  top_k: 6

components:

  embedder:
    type: EMBEDDING_AGENT
    params:
      name: embedder
      url: "http://localhost:7216/v1"
      model_name: "Qwen/Qwen3-Embedding-4B"

  data_base:
    type: LOCAL_DB
    params:
      path_to_db: "data/docs_database_examples_apis.db"
      path_to_vector_db: "data/sparse_qdrant_test_apis"
      collection_name: "docs"

      return_full_docs: False
      return_examples: False
      merge_examples: False

  chunker:
    type: RECURSIVE_CHUNKER
    params:
      name: chunker
      max_chunk_size: 1000

  filter:
    type: LENGTH_FILTER
    params:
      name: filter
      min_len: 20

  context_assembler:
    type: CORAG_CONTEXT_ASSEMBLER
    params:
      name: corag_assembler

  retriever:
    type: API_CORAG_RETRIEVER
    params:
      name: api_corag_retriever

      url: "http://localhost:7215/v1"
      search_type: sample

      max_path_length: 3
      max_message_length: 4096
      temperature: 0.2
      task_description: solve Python programming problem using library APIs

      include_original_docs: True
      use_full_documents: True

      expand_size: 4
      num_rollouts: 2
      beam_size: 1
      n: 2

  agent:
    type: API_CORAG_FINAL_SOLVER
    params:
      name: api_corag_solver

      url: "http://localhost:7215/v1"

      temperature: 0.2
      top_p: 0.95
      max_tokens: 1024
      stop_tokens: ["</code>", "# SOLUTION END"]
