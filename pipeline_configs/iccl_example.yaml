type: SIMPLE

params:
  top_k: 10

components:
  
  embedder:
    type: EMBEDDING_AGENT
    params:
      name: embedder
      url: "http://localhost:7216/v1"
      model_name: "Qwen/Qwen3-Embedding-4B"
  
  data_base:
    type: LOCAL_DB
    params:
      path_to_db: "data/docs_database_examples.db"
      path_to_vector_db: "data/docs_vdb_rc_1000_meta_ml20"
      collection_name: "docs"

      return_examples: True
      
      hnsw_space: "cosine"
      hnsw_m: 16
      hnsw_construction_ef: 400
      hnsw_search_ef: 200
      batch_size: 16
      
      search_filter:
        source: "documents"
  
  chunker:
    type: RECURSIVE_CHUNKER
    params:
      name: chunker
      max_chunk_size: 1000
  
  filter:
    type: LENGTH_FILTER
    params:
      name: filter
      min_len: 20
  
  context_assembler:
    type: EXAMPLES_CONTEXT_ASSEMBLER
    params:
      name: examples_assembler
  
  retriever:
    type: SIMPLE_RETRIEVER
    params:
      name: simple_retriever
      return_docs_as_chunks: False

  icl_block:
    type: ICCL_ICL
    params:
      url: "http://localhost:7215/v1"
      model_name: "Qwen/Qwen1.5-32B-Chat-AWQ"
  
  enchancer:
    type: QUERY_GENERATOR
    params:
      name: query_gen
      url: "http://localhost:7215/v1"
      model_name: "Qwen/Qwen1.5-32B-Chat-AWQ"
      options: 1
  
  agent:
    type: DS1000_SOLVER_AGENT
    params:
      name: ds1000_solver

      url: "http://localhost:7215/v1"
      model_name: "Qwen/Qwen1.5-32B-Chat-AWQ"
      
      api: chat
      context_after_task: False
      
      temperature: 0.2
      top_p: 0.95
      max_tokens: 1024
      stop_tokens: ["</code>", "# SOLUTION END"]
