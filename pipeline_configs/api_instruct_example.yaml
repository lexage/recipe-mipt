type: SIMPLE

params:
  top_k: 6

components:

  embedder:
    type: EMBEDDING_AGENT
    params:
      name: embedder
      url: "http://localhost:7216/v1"
      model_name: "Qwen/Qwen3-Embedding-4B"

  data_base:
    type: LOCAL_DB
    params:
      path_to_db: "data/docs_database_examples_apis.db"
      path_to_vector_db: "data/sparse_qdrant_test_apis"
      collection_name: "docs"

      return_full_docs: False
      return_examples: False
      merge_examples: False

  chunker:
    type: RECURSIVE_CHUNKER
    params:
      name: chunker
      max_chunk_size: 1000

  filter:
    type: LENGTH_FILTER
    params:
      name: filter
      min_len: 20

  context_assembler:
    type: INSTRUCT_CONTEXT_ASSEMBLER
    params:
      name: instruct_assembler

  api_selector:
    type: API_SELECTOR
    params:
      url: "http://localhost:7215/v1"
      temperature: 0.1
      max_tokens: 256

  rationality_agent:
    type: API_INSTRUCT_RATIONALITY_AGENT
    params:
      url: "http://localhost:7215/v1"
      temperature: 0.2
      top_p: 0.95
      max_tokens: 384

  retriever:
    type: API_INSTRUCT_RETRIEVER
    params:
      name: api_instruct_retriever

      max_apis: 8
      api_top_k: 1
      chunks_per_api: 1
      include_original_docs: true

  agent:
    type: DS1000_SOLVER_AGENT
    params:
      name: ds1000_solver
      url: "http://localhost:7215/v1"
      api: chat
      temperature: 0.2
      top_p: 0.95
      max_tokens: 1024
      stop_tokens: ["</code>", "# SOLUTION END"]
