# Ablation 3 — InstructRetriever (+ relevance rationales)
# Same doc retrieval, but each retrieved chunk is paired with an LLM-generated
# rationale explaining WHY it is relevant to the query (rationality_agent), and
# those rationales are appended to the context. No examples, no full docs.
type: SIMPLE

params:
  top_k: 5

components:

  embedder:
    type: EMBEDDING_AGENT
    params:
      name: embedder
      url: "http://localhost:7216/v1"
      model_name: "Qwen/Qwen3-Embedding-4B"

  data_base:
    type: LOCAL_DB
    params:
      path_to_db: "C:/Projects/docs_database_examples.db"
      path_to_vector_db: "data/vdb_ablation_3_instruct"
      collection_name: "docs"
      return_full_docs: False
      return_examples: False
      merge_examples: False
      hnsw_space: "cosine"
      hnsw_m: 16
      hnsw_construction_ef: 400
      hnsw_search_ef: 200
      batch_size: 16
      similarity_threshold: 0.1
      search_filter:
        source: "documents"

  chunker:
    type: RECURSIVE_CHUNKER
    params:
      name: chunker
      max_chunk_size: 1000

  filter:
    type: LENGTH_FILTER
    params:
      name: filter
      min_len: 20

  context_assembler:
    type: INSTRUCT_CONTEXT_ASSEMBLER
    params:
      name: instruct_assembler

  # dependency of the InstructRetriever: writes the per-chunk relevance rationale
  rationality_agent:
    type: INSTRUCT_RATIONALITY_AGENT
    params:
      name: instruct_rationality_agent
      url: "http://localhost:7215/v1"
      model_name: "Qwen/Qwen2.5-32B-Instruct"
      temperature: 0.2
      top_p: 0.95
      max_tokens: 256

  retriever:
    type: INSTRUCT_RETRIEVER
    params:
      name: instruct_retriever

  agent:
    type: CODEMMLU_SOLVER_AGENT
    params:
      name: codemmlu_solver
      url: "http://localhost:7215/v1"
      model_name: "Qwen/Qwen2.5-32B-Instruct"
      api: completions
      context_after_task: False
      temperature: 0.2
      top_p: 0.95
      max_tokens: 1024
      stop_tokens: []
