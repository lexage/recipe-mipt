type: SIMPLE

params:
  top_k: 3

components:
  
  embedder:
    type: EMBEDDING_AGENT
    params:
      name: embedder
      url: "http://localhost:7216/v1"
      model_name: "Qwen/Qwen3-Embedding-4B"
  
  data_base:
    type: LOCAL_DB
    params:
      path_to_db: "data/docs_database_examples.db"
      path_to_vector_db: "data/docs_vdb_rc_1000_meta_ml500"
      collection_name: "docs"
      
      hnsw_space: "cosine"
      hnsw_m: 16
      hnsw_construction_ef: 400
      hnsw_search_ef: 200
      batch_size: 16

      similarity_threshold: 0.1
      
      search_filter:
        source: "documents"
  
  chunker:
    type: RECURSIVE_CHUNKER
    params:
      name: chunker
      max_chunk_size: 1000
  
  filter:
    type: LENGTH_FILTER
    params:
      name: filter
      min_len: 500
  
  context_assembler:
    type: CORAG_CONTEXT_ASSEMBLER
    params:
      name: simple_assembler
  
  retriever:
    type: CORAG_RETRIEVER
    params:
      name: corag_retriever

      url: "http://localhost:7215/v1"
      search_type: sample
      return_docs_as_chunks: False

      max_path_length: 3
      max_message_length: 4096
      temperature: 0.7
      task_description: answer multihop question

      return_only_path: True

      expand_size: 4 
      num_rollouts: 2 
      beam_size: 1

      n: 2
  
  agent:
    type: CORAG_FINAL_SOLVER
    params:
      name: corag_solver_agent

      url: "http://localhost:7215/v1"
      model_name: "Qwen/Qwen1.5-32B-Chat-AWQ"

      temperature: 0.2
      top_p: 0.95
      max_tokens: 1024
      stop_tokens: ["</code>", "# SOLUTION END"]
