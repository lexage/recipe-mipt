type: REWOO
components:
  tools:
    - type: LIST_FILES_TOOL
    - type: READ_FILE_TOOL
    - type: SEARCH_CODE_TOOL
    - type: LLM_TOOL
      params:
        url: http://127.0.0.1:11469/v1
        model_name: Qwen/Qwen2.5-32B-Instruct
        temperature: 0.0
        timeout: 300.0
        max_retries: 2
    - type: APPLY_PATCH_TOOL
    - type: RUN_COMMAND_TOOL
      params:
        default_timeout: 120
        max_timeout: 600
    - type: GIT_DIFF_TOOL

  planner:
    type: REWOO_PLANNER
    params:
      name: rewoo-sgr-planner
      url: http://127.0.0.1:11469/v1
      model_name: Qwen/Qwen2.5-32B-Instruct
      temperature: 0.0
      maximum_steps: 12

  worker:
    type: REWOO_WORKER
    params:
      name: rewoo-sgr-worker
      url: http://127.0.0.1:11469/v1
      model_name: Qwen/Qwen2.5-32B-Instruct

  solver:
    type: REWOO_SOLVER
    params:
      name: rewoo-sgr-solver
      url: http://127.0.0.1:11469/v1
      model_name: Qwen/Qwen2.5-32B-Instruct
      temperature: 0.0

logs_path: rewoo-sgr/swe-rebench/logs
