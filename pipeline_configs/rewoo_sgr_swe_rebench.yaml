type: REWOO
components:
  tools:
    - type: LIST_FILES_TOOL
    - type: READ_FILE_TOOL
    - type: SEARCH_CODE_TOOL
    - type: APPLY_PATCH_TOOL
    - type: RUN_COMMAND_TOOL
      params:
        default_timeout: 120
        max_timeout: 600
    - type: GIT_DIFF_TOOL

  planner:
    type: REWOO_PLANNER
    params:
      name: rewoo-sgr-planner
      url: http://localhost:7215/v1
      model_name: Qwen/Qwen1.5-32B-Chat-AWQ
      temperature: 0.0
      maximum_steps: 12

  worker:
    type: REWOO_WORKER
    params:
      name: rewoo-sgr-worker
      url: http://localhost:7215/v1
      model_name: Qwen/Qwen1.5-32B-Chat-AWQ

  solver:
    type: REWOO_SOLVER
    params:
      name: rewoo-sgr-solver
      url: http://localhost:7215/v1
      model_name: Qwen/Qwen1.5-32B-Chat-AWQ
      temperature: 0.0

logs_path: rewoo-sgr/swe-rebench/logs
