type: REACT
components:
  embedder:
    type: EMBEDDING_AGENT
    params:
      name: embedder
      url: "http://localhost:11459/v1"
      model_name: "Qwen/Qwen3-Embedding-4B"

  data_base:
    type: LOCAL_DB
    params:
      path_to_db: "/workspace/proj/grant/data/docs_database_examples_apis.db"
      path_to_vector_db: "/workspace/proj/grant/data/sparse_qdrant_test_apis"
      collection_name: "docs"
      
      return_full_docs: False
      return_examples: False
      merge_examples: False

  context_assembler:
    type: INSTRUCT_CONTEXT_ASSEMBLER
    params:
      name: simple_assembler

  api_selector:
    type: API_SELECTOR
    params:
      url: "http://localhost:11456/v1"
      temperature: 0.1
      max_tokens: 256

  rationality_agent:
    type: API_INSTRUCT_RATIONALITY_AGENT
    params:
      url: "http://localhost:11456/v1"
      model_name: "Qwen/Qwen2.5-32B-Instruct"
      temperature: 0.2
      top_p: 0.95
      max_tokens: 384

  retriever:
    type: API_INSTRUCT_RETRIEVER
    params:
      name: api_instruct_retriever

      max_apis: 8
      api_top_k: 1
      chunks_per_api: 1
      include_original_docs: true

  tools:
    - type: DB_SEARCH_TOOL
      params:
        top_k: 5

    - type: CRITIC_TOOL
      params:
        name: "reflexion"
        url: "http://localhost:11456/v1"
        model_name: "Qwen/Qwen2.5-32B-Instruct"

  agent:
    type: REACT_AGENT_SGR
    params:
      name: "ReActAgentSGR"
      url: "http://localhost:11456/v1"
      model_name: "Qwen/Qwen2.5-32B-Instruct"
      temperature: 0.7

logs_path: "/workspace/proj/grant/exps_09_09_method/logs"