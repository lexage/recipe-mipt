# Doc-format ablation: full docs | theory only | raw | whole document
type: SIMPLE

params:
  top_k: 5

components:

  embedder:
    type: EMBEDDING_AGENT
    params:
      name: embedder
      url: "http://localhost:7216/v1"
      model_name: "Qwen/Qwen3-Embedding-4B"

  data_base:
    type: LOCAL_DB
    params:
      path_to_db: "C:/Projects/docs_database_examples.db"
      path_to_vector_db: "data/vdb_doc_4_fulldoc"
      collection_name: "docs"
      return_full_docs: True
      return_examples: False
      merge_examples: False
      hnsw_space: "cosine"
      hnsw_m: 16
      hnsw_construction_ef: 400
      hnsw_search_ef: 200
      batch_size: 16
      similarity_threshold: 0.1
      search_filter:
        source: "documents"

  chunker:
    type: RECURSIVE_CHUNKER
    params:
      name: chunker
      max_chunk_size: 1000

  filter:
    type: LENGTH_FILTER
    params:
      name: filter
      min_len: 20

  context_assembler:
    type: SIMPLE_CONTEXT_ASSEMBLER
    params:
      name: simple_assembler

  retriever:
    type: SIMPLE_RETRIEVER
    params:
      name: simple_retriever

  agent:
    type: CODEMMLU_SOLVER_AGENT
    params:
      name: codemmlu_solver
      url: "http://localhost:7215/v1"
      model_name: "Qwen/Qwen2.5-32B-Instruct"
      api: completions
      context_after_task: False
      temperature: 0.2
      top_p: 0.95
      max_tokens: 1024
      stop_tokens: []
