# Ablation 6 — InstructRetriever + few-shot + full_docs
# The full combination: relevance rationales + worked code examples (merged) +
# each hit expanded to its full parent document.
type: SIMPLE

params:
  top_k: 5

components:

  embedder:
    type: EMBEDDING_AGENT
    params:
      name: embedder
      url: "http://localhost:7216/v1"
      model_name: "Qwen/Qwen3-Embedding-4B"

  data_base:
    type: LOCAL_DB
    params:
      path_to_db: "C:/Projects/docs_database_examples.db"
      path_to_vector_db: "data/vdb_ablation_6_instruct_fewshot_fulldocs"
      collection_name: "docs"
      return_full_docs: True      # <-- full parent document
      return_examples: True       # <-- + code examples
      merge_examples: True        # <-- folded into the chunk
      hnsw_space: "cosine"
      hnsw_m: 16
      hnsw_construction_ef: 400
      hnsw_search_ef: 200
      batch_size: 16
      similarity_threshold: 0.1
      search_filter:
        source: "documents"

  chunker:
    type: RECURSIVE_CHUNKER
    params:
      name: chunker
      max_chunk_size: 1000

  filter:
    type: LENGTH_FILTER
    params:
      name: filter
      min_len: 20

  context_assembler:
    type: INSTRUCT_CONTEXT_ASSEMBLER
    params:
      name: instruct_assembler

  rationality_agent:
    type: INSTRUCT_RATIONALITY_AGENT
    params:
      name: instruct_rationality_agent
      url: "http://localhost:7215/v1"
      model_name: "Qwen/Qwen2.5-32B-Instruct"
      temperature: 0.2
      top_p: 0.95
      max_tokens: 256

  retriever:
    type: INSTRUCT_RETRIEVER
    params:
      name: instruct_retriever

  agent:
    type: CODEMMLU_SOLVER_AGENT
    params:
      name: codemmlu_solver
      url: "http://localhost:7215/v1"
      model_name: "Qwen/Qwen2.5-32B-Instruct"
      api: completions
      context_after_task: False
      temperature: 0.2
      top_p: 0.95
      max_tokens: 1024
      stop_tokens: []
