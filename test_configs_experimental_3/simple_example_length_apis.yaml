type: SIMPLE

# === ЭКСПЕРИМЕНТ 3: фильтрация на API-пайплайне ===
# Конфиг: length | БД: apis (data/docs_database_examples_apis.db)
# Стенд починен: свой свежий индекс (path_to_vector_db ниже уникален).

params:
  top_k: 6

components:

  embedder:
    type: EMBEDDING_AGENT
    params:
      name: embedder
      url: "http://0.0.0.0:7216/v1"
      model_name: "Qwen/Qwen3-Embedding-4B"

  data_base:
    type: LOCAL_DB
    params:
      path_to_db: "data/docs_database_examples_apis.db"
      path_to_vector_db: "data/vdb_exp3/length_apis"     # УНИКАЛЬНО на конфиг — свежий индекс
      collection_name: "docs"

      return_full_docs: False
      return_examples: False          # коллеги: примеры в контексте вредят
      merge_examples: False

  chunker:
    type: RECURSIVE_CHUNKER
    params:
      name: chunker
      max_chunk_size: 1000

  # ---- ФИЛЬТР (наша зона, до эмбеддера) ----
  filter:
    type: LENGTH_FILTER
    params:
      name: filter
      min_len: 20

  # ---- ГЕНЕРАЦИЯ (закреплена, пока ОТКЛЮЧЕНА — активируем на этапе генерации) ----
  # generator:
  #   type: CODE_EVAL_GENERATOR
  #   params:
  #     url: "http://0.0.0.0:7215/v1"
  #     model_name: "Qwen/Qwen2.5-32B-Instruct"
  #     prob: 0.05

  context_assembler:
    type: CORAG_CONTEXT_ASSEMBLER
    params:
      name: corag_assembler

  retriever:
    type: API_RETRIEVER
    params:
      name: api_retriever
      max_apis: 8
      api_top_k: 1
      chunks_per_api: 1

  api_selector:
    type: API_SELECTOR
    params:
      url: "http://0.0.0.0:7215/v1"
      temperature: 0.1
      max_tokens: 256

  agent:
    type: DS1000_SOLVER_AGENT
    params:
      name: ds1000_solver
      url: "http://0.0.0.0:7215/v1"
      api: completions
      context_after_task: False
      temperature: 0.2
      top_p: 0.95
      max_tokens: 1024
      stop_tokens: ["</code>", "# SOLUTION END"]
