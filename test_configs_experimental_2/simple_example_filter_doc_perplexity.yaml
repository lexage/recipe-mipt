type: SIMPLE_WITH_DOC_FILTER

# DocumentPerplexityFilter — perplexity Qwen2.5-32B на уровне документов
# (первые 2000 символов каждого). Кратно дешевле чем chunk-level.

params:
  top_k: 5

components:

  embedder:
    type: EMBEDDING_AGENT
    params:
      name: embedder
      url: "http://0.0.0.0:7216/v1"
      model_name: "Qwen/Qwen3-Embedding-4B"

  data_base:
    type: LOCAL_DB
    params:
      path_to_db: "data/docs_database_examples_apis.db"
      path_to_vector_db: "data/docs_vdb_rc_1000_meta_ml20"
      collection_name: "docs"

      return_examples: True
      return_full_docs: False
      merge_examples: False

      hnsw_space: "cosine"
      hnsw_m: 16
      hnsw_construction_ef: 400
      hnsw_search_ef: 200
      batch_size: 16

      search_filter:
        source: "documents"

  chunker:
    type: RECURSIVE_CHUNKER
    params:
      name: chunker
      max_chunk_size: 1000

  document_filter:
    type: DOC_PERPLEXITY_FILTER
    params:
      name: doc_filter
      llm_url: "http://0.0.0.0:7215/v1"
      llm_model: "Qwen/Qwen2.5-32B-Instruct"
      api_key: "vllm"
      low_quantile: 0.10              # отсекаем 10% наименее informative
      high_quantile: 0.95             # отсекаем 5% самых noisy
      concurrent_requests: 8
      max_chars: 2000                 # первые 2000 символов

  context_assembler:
    type: CORAG_CONTEXT_ASSEMBLER
    params:
      name: simple_assembler

  retriever:
    type: SIMPLE_RETRIEVER
    params:
      name: simple_retriever

  enchancer:
    type: QUERY_GENERATOR
    params:
      name: query_gen
      url: "http://0.0.0.0:7215/v1"
      model_name: "Qwen/Qwen2.5-32B-Instruct"
      options: 1

  agent:
    type: DS1000_SOLVER_AGENT
    params:
      name: ds1000_solver
      url: "http://0.0.0.0:7215/v1"
      model_name: "Qwen/Qwen2.5-32B-Instruct"
      api: chat
      context_after_task: False
      temperature: 0.2
      top_p: 0.95
      max_tokens: 1024
      stop_tokens: ["</code>", "# SOLUTION END"]
