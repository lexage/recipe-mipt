type: SIMPLE

# === ПОВТОР БЕЙЗЛАЙНА: проверка шума.
# Побайтово те же компоненты и параметры, что у final_test_configs/c0_base,
# тот же готовый индекс. Единственный вопрос, на который отвечает этот прогон:
# воспроизводится ли число бейзлайна на том же коде и той же модели.

params:
  top_k: 5

components:

  embedder:
    type: EMBEDDING_AGENT
    params:
      name: embedder
      url: "http://0.0.0.0:7216/v1"
      model_name: "Qwen/Qwen3-Embedding-4B"

  data_base:
    type: LOCAL_DB
    params:
      path_to_db: "data/docs_database_examples.db"
      path_to_vector_db: "data/vdb_final_rc_1000"
      collection_name: "docs"

      return_examples: True
      return_full_docs: False
      merge_examples: True

      hnsw_space: "cosine"
      hnsw_m: 16
      hnsw_construction_ef: 400
      hnsw_search_ef: 200
      batch_size: 16

      search_filter:
        source: "documents"

  chunker:
    type: RECURSIVE_CHUNKER
    params:
      name: chunker
      max_chunk_size: 1000

  context_assembler:
    type: CORAG_CONTEXT_ASSEMBLER
    params:
      name: simple_assembler

  retriever:
    type: SIMPLE_RETRIEVER
    params:
      name: simple_retriever

  agent:
    type: DS1000_SOLVER_AGENT
    params:
      url: "http://0.0.0.0:7217/v1"

      api: chat
      enable_thinking: False

      temperature: 0.2
      top_p: 0.95
      max_tokens: 1024
      stop_tokens: ["</code>", "# SOLUTION END"]
